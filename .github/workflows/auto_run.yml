name: Capital Hill Auto Run

on:
  workflow_dispatch:
    inputs:
      slot:
        description: Optionaler Slot wie 10:30, 15:40, 18:30, 22:10
        required: false
        type: string
  schedule:
    - cron: "*/10 8-21 * * 1-5"

concurrency:
  group: capital-hill-auto-run
  cancel-in-progress: false

jobs:
  auto-run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install streamlit gspread yfinance plotly pandas numpy requests

      - name: Auto-Run ausführen
        env:
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          LOG_SPREADSHEET_NAME: ${{ secrets.LOG_SPREADSHEET_NAME }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCREENER_EMAIL: ${{ secrets.SCREENER_EMAIL }}
          SCREENER_APP_PASSWORD: ${{ secrets.SCREENER_APP_PASSWORD }}
          SCREENER_RECIPIENT: ${{ secrets.SCREENER_RECIPIENT }}
        run: |
          if [ -n "${{ github.event.inputs.slot }}" ]; then
            python auto_run_job.py --slot "${{ github.event.inputs.slot }}"
          else
            python auto_run_job.py
          fi
